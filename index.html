<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trust Wallet Connect</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b0e14;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .box {
      background: #12161f;
      border: 1px solid #1e2430;
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #3375bb;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
    }
    button:hover {
      opacity: 0.92;
    }
    .info {
      margin-top: 18px;
      background: #0b0e14;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      text-align: left;
      word-break: break-all;
      display: none;
    }
    .label {
      color: #8a94a6;
      font-size: 11px;
      margin-top: 10px;
    }
    .value {
      font-weight: bold;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Trust Wallet Connect</h2>
    <p style="color:#8a94a6; font-size:13px;">
      Trust Wallet ke DApp browser ya supported browser mein open karke connect karein.
    </p>
    <button id="connectBtn" onclick="connectTrustWallet()">Connect Trust Wallet</button>

    <div class="info" id="walletInfo">
      <div class="label">Connected Address</div>
      <div class="value" id="addressText">-</div>

      <div class="label">Network Chain ID</div>
      <div class="value" id="chainText">-</div>

      <div class="label">Native Balance (BNB / ETH)</div>
      <div class="value" id="nativeBalanceText">-</div>

      <div class="label">USDT Balance (BEP-20 / ERC-20)</div>
      <div class="value" id="usdtBalanceText">-</div>
    </div>
  </div>

  <script>
    // Popular networks ke USDT contract addresses
    const USDT_CONTRACTS = {
      1: "0xdAC17F958D2ee523a2206206994597C13D831ec7",   // Ethereum Mainnet (ERC-20)
      56: "0x55d398326f99059fF775485246999027B3197955",  // BNB Smart Chain (BEP-20)
      137: "0xc2132D05D31c914a87C6611C10748AEb04B58e8F"  // Polygon
    };

    const ERC20_ABI = [
      "function balanceOf(address owner) view returns (uint256)",
      "function decimals() view returns (uint8)"
    ];

    function getProvider() {
      if (window.trustwallet && window.trustwallet.ethereum) {
        return window.trustwallet.ethereum;
      }
      if (window.ethereum) {
        return window.ethereum;
      }
      return null;
    }

    async function connectTrustWallet() {
      const rawProvider = getProvider();
      const btn = document.getElementById("connectBtn");
      const infoBox = document.getElementById("walletInfo");

      if (!rawProvider) {
        alert("Wallet nahi mila. Kripya is page ko Trust Wallet ke DApp browser mein kholein.");
        return;
      }

      try {
        btn.innerText = "Connecting...";
        const provider = new ethers.providers.Web3Provider(rawProvider, "any");
        await provider.send("eth_requestAccounts", []);

        const signer = provider.getSigner();
        const address = await signer.getAddress();
        const network = await provider.getNetwork();

        // 1. Native balance fetch karein (BNB / ETH / MATIC)
        const rawBalance = await provider.getBalance(address);
        const formattedNative = parseFloat(ethers.utils.formatEther(rawBalance)).toFixed(4);

        document.getElementById("addressText").innerText = address;
        document.getElementById("chainText").innerText = `${network.name} (${network.chainId})`;
        document.getElementById("nativeBalanceText").innerText = formattedNative;

        // 2. USDT balance fetch karein agar network supported hai
        const usdtAddress = USDT_CONTRACTS[network.chainId];
        if (usdtAddress) {
          const usdtContract = new ethers.Contract(usdtAddress, ERC20_ABI, provider);
          const [rawUsdt, decimals] = await Promise.all([
            usdtContract.balanceOf(address),
            usdtContract.decimals()
          ]);
          const formattedUsdt = parseFloat(ethers.utils.formatUnits(rawUsdt, decimals)).toFixed(2);
          document.getElementById("usdtBalanceText").innerText = `${formattedUsdt} USDT`;
        } else {
          document.getElementById("usdtBalanceText").innerText = "Network not configured for USDT";
        }

        infoBox.style.display = "block";
        btn.innerText = "Connected";
      } catch (err) {
        console.error(err);
        btn.innerText = "Connect Trust Wallet";
        alert("Connection cancel ya fail ho gaya.");
      }
    }
  </script>
</body>
</html>
